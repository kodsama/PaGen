stages:
  - test
  - build

flutter_test:
  stage: test
  script:
    - flutter
  tags:
    - flutter

flutter_build_android:
  stage: build
  before_script:
    - flutter packages get
    - flutter clean
  script:
     - flutter build apk
  artifacts:
    paths:
      - build/app/outputs/apk/release/app-release.apk
  tags:
    - flutter